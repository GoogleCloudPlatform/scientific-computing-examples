---

# ClusterA Blueprint: Represents the Primary / On-Premises Slurm Cluster
# (Use this blueprint when simulating the On-Premises ClusterA environment inside GCP)
blueprint_name: clustera

vars:
  project_id: <YOUR_PROJECT_ID>
  deployment_name: clustera
  region: us-central1
  zone: us-central1-a

# Documentation for each of the modules used below can be found at
# https://github.com/GoogleCloudPlatform/cluster-toolkit/blob/main/modules/README.md

deployment_groups:
- group: primary
  modules:
  - id: network
    source: modules/network/pre-existing-vpc
    settings:
      project_id: $(vars.project_id)
      region: $(vars.region)
      network_name: default
      subnetwork_name: default

  - id: private_service_access
    source: modules/network/private-service-access
    use: [network]

  - id: homefs
    source: modules/file-system/filestore
    use: [network, private_service_access]
    settings:
      local_mount: /home

  - id: debug_a_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network]
    settings:
      node_count_dynamic_max: 4
      machine_type: n2-standard-2
      allow_automatic_updates: false

  - id: debug_a_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use:
    - debug_a_nodeset
    settings:
      partition_name: debug
      exclusive: false
      is_default: true

  - id: compute_a_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network]
    settings:
      node_count_dynamic_max: 20
      bandwidth_tier: gvnic_enabled
      allow_automatic_updates: false

  - id: compute_a_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use:
    - compute_a_nodeset
    settings:
      partition_name: compute

  - id: h3_a_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network]
    settings:
      node_count_dynamic_max: 20
      machine_type: h3-standard-88
      disk_type: pd-balanced
      bandwidth_tier: gvnic_enabled
      allow_automatic_updates: false

  - id: h3_a_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use:
    - h3_a_nodeset
    settings:
      partition_name: h3

  - id: slurm_login
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-login
    use: [network]
    settings:
      machine_type: n2-standard-4
      enable_login_public_ips: true

  - id: slurm_controller
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-controller
    use:
    - network
    - debug_a_partition
    - compute_a_partition
    - h3_a_partition
    - homefs
    - slurm_login
    settings:
      enable_controller_public_ips: true

