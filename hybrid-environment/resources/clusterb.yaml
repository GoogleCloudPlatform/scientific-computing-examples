---

# ClusterB Blueprint: Represents the New Auto-Scaling Slurm Cluster in your GCP Project
# (Receives cloud-burst jobs submitted from On-Premises ClusterA via `sbatch -M clusterb`)
blueprint_name: clusterb

vars:
  project_id: <YOUR_PROJECT_ID>
  deployment_name: clusterb
  region: us-central1
  zone: us-central1-a
  nfs_address: <FILESTORE_IP_ADDRESS>

# Documentation for each of the modules used below can be found at
# https://github.com/GoogleCloudPlatform/cluster-toolkit/blob/main/modules/README.md

deployment_groups:
- group: primary
  modules:
  - id: network
    source: modules/network/pre-existing-vpc
    settings:
      project_id: $(vars.project_id)
      region: $(vars.region)
      network_name: default
      subnetwork_name: default

  - id: homefs
    source: modules/file-system/pre-existing-network-storage
    settings:
      server_ip: $(vars.nfs_address)
      remote_mount: nfsshare
      local_mount: /home
      fs_type: nfs

  - id: debug_b_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network]
    settings:
      node_count_dynamic_max: 4
      machine_type: n2-standard-64
      allow_automatic_updates: false

  - id: debug_b_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use:
    - debug_b_nodeset
    settings:
      partition_name: clusterb
      exclusive: false
      is_default: true

  - id: compute_b_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network]
    settings:
      node_count_dynamic_max: 20
      bandwidth_tier: gvnic_enabled
      allow_automatic_updates: false

  - id: compute_b_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use:
    - compute_b_nodeset
    settings:
      partition_name: compute

  - id: slurm_login
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-login
    use: [network]
    settings:
      machine_type: n2-standard-4
      enable_login_public_ips: true

  - id: slurm_controller
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-controller
    use:
    - network
    - debug_b_partition
    - compute_b_partition
    - homefs
    - slurm_login
    settings:
      enable_controller_public_ips: true

