blueprint_name: alpha-evolve-platform

vars:
  # === GCP Project & Deployment Infrastructure ===
  exp_deployment_name: ae-exp
  user_experiment_name: experiment-1
  deployment_name: $(vars.exp_deployment_name)-$(vars.user_experiment_name)
  cloud_build_service_account: "$(vars.infra_deployment_name)-build-sa@$(vars.project_id).iam.gserviceaccount.com"
  controller_service_account: "$(vars.infra_deployment_name)-ctrl-sa@$(vars.project_id).iam.gserviceaccount.com"

  # === Paths & Build Config (Internal) ===
  cloud_build_path: $(ghpc_stage("./infrastructure/build/cloud-build.yaml.tfpl"))
  cloud_build_dir: $(ghpc_stage("."))

  # === Docker Images ===
  base_controller_image: python:3.12-slim-bookworm # base image for the controller job
  base_evaluator_image: python:3.12-slim-bookworm # base image for the evaluator job

  # === AlphaEvolve API Config ===
  region_code: global
  location: global
  base_url: discoveryengine.googleapis.com
  collection: default_collection
  concurrency: 4 # number of concurrent candidates to AlphaEvolve will generate at one time.
  model: GEMINI_V3P5_FLASH
  max_programs_generated: 100 # max number of programs AE API will generate in total
  max_duration: 6 # Absolute maximum wall-clock lifespan of the experiment run in hours (valid range: 1 to 24)
  idle_timeout: 5 # Maximum inactivity period allowed in hours (must be strictly less than max_duration)

  # === Experiment Execution Control ===
  max_programs_evaluated: 20 # number of evaluations jobs that will be run
  num_samplers: 4 # number of threads polling AlphaEvolve API for candidates
  poll_interval: 4 # in seconds
  evaluation_mode: "batch" # "batch"

  # === Cloud Batch & Worker VM Config ===
  evaluation_machine_type: n2-standard-4
  evaluation_provisioning_model: "STANDARD"
  boot_disk_image: "projects/debian-cloud/global/images/family/debian-12"
  mount_path: "/mnt/disks/share"
  max_duration_seconds: 3600
  delete_succeeded_jobs: "true"
  accelerator_count: 1 # only used if evaluation_machine_type starts with "n1-" for GPU attach
  accelerator_type: "nvidia-tesla-t4" # only used if evaluation_machine_type starts with "n1-" for GPU attach

  # === Storage Config ===
  programs_dir: "program_candidates"

  # === Example Config ===
  example_dir: "user_examples/adaptive_sort_cpp"

deployment_groups:

- group: repository-infrastructure
  modules:
  - id: artifact-repository
    source: git::https://github.com/GoogleCloudPlatform/terraform-google-artifact-registry.git
    settings:
      project_id: $(vars.project_id)
      location: $(vars.region)
      format: DOCKER
      repository_id: $(vars.deployment_name)-repo

  # Untrusted Sandbox Service Account created per-experiment
  - id: evaluator-sa
    source: modules/project/service-account
    settings:
      name: "eval-sa"
      project_roles:
        - batch.agentReporter
        - artifactregistry.reader
        - logging.logWriter

  - id: evaluator-bucket-iam
    source: git::https://github.com/terraform-google-modules/terraform-google-iam.git//modules/storage_buckets_iam
    settings:
      storage_buckets:
        - $(vars.existing_bucket_name)
      mode: additive
      bindings:
        roles/storage.objectUser:
          - "serviceAccount:$(evaluator-sa.service_account_email)"

  - id: evaluator-pubsub-iam
    source: git::https://github.com/terraform-google-modules/terraform-google-iam.git//modules/pubsub_topics_iam
    settings:
      project: $(vars.project_id)
      pubsub_topics:
        - $(vars.infra_deployment_name)-batch-notifications
      mode: additive
      bindings:
        roles/pubsub.publisher:
          - "serviceAccount:$(evaluator-sa.service_account_email)"

  - id: evaluator-sa-user-iam
    source: git::https://github.com/terraform-google-modules/terraform-google-iam.git//modules/service_accounts_iam
    settings:
      project: $(vars.project_id)
      service_accounts:
        - $(evaluator-sa.service_account_email)
      mode: additive
      bindings:
        roles/iam.serviceAccountUser:
          - "serviceAccount:$(vars.controller_service_account)"

- group: cloud-build
  modules:
  - id: cloud-build
    source: ./infrastructure/community/modules/cloud-build
    settings:
      project_id: $(vars.project_id)
      region: $(vars.region)
      cloud_build_template_path: $(vars.cloud_build_path)
      cloud_build_dir: $(vars.cloud_build_dir)
      service_account: $(vars.cloud_build_service_account)
      template_vars:
        _PROJECT_ID: $(vars.project_id)
        _REGION: $(vars.region)
        _REPO_NAME: $(artifact-repository.artifact_name)
        _USER_EXPERIMENT_NAME: $(vars.user_experiment_name)
        _BASE_CONTROLLER_IMAGE: $(vars.base_controller_image)
        _BASE_EVALUATOR_IMAGE: $(vars.base_evaluator_image)
        _BOOT_DISK_IMAGE: $(vars.boot_disk_image)
        _EXAMPLE_DIR: $(vars.example_dir)

- group: pubsub-subscription
  modules:
  - id: project-info
    source: ./infrastructure/community/modules/project/project-info
    settings:
      project_id: $(vars.project_id)
  - id: experiment-subscription
    source: git::https://github.com/terraform-google-modules/terraform-google-pubsub.git
    settings:
      project_id: $(vars.project_id)
      topic: $(vars.infra_deployment_name)-batch-notifications
      create_topic: false
      pull_subscriptions:
        - name: $(vars.deployment_name)-subscription
          filter: 'hasPrefix(attributes.JobName, "projects/$(project-info.project_number)/locations/$(vars.region)/jobs/$(vars.deployment_name)-")'
- group: pubsub-subscription-iam
  modules:
  - id: subscription-iam
    source: git::https://github.com/terraform-google-modules/terraform-google-iam.git//modules/pubsub_subscriptions_iam
    settings:
      project: $(vars.project_id)
      pubsub_subscriptions:
        - $(vars.deployment_name)-subscription
      mode: additive
      bindings:
        roles/pubsub.subscriber:
          - "serviceAccount:$(vars.controller_service_account)"
        roles/pubsub.viewer:
          - "serviceAccount:$(vars.controller_service_account)"

- group: experiment-setup
  modules:
  - id: experiment-setup
    source: ./infrastructure/community/modules/alpha-evolve/setup
    settings:
      stage: experiment
      project_id: $(vars.project_id)
      bucket_name: $(vars.existing_bucket_name)
      object_path: $(vars.user_experiment_name)/variables.env
      user_experiment_name: $(vars.user_experiment_name)
      env_vars:
        _PROJECT_ID: $(vars.project_id)
        _PUBSUB_SUBSCRIPTION: $(experiment-subscription.subscription_names[0])
        _REPO_NAME: $(artifact-repository.artifact_name)
        _MOUNT_PATH: $(vars.mount_path)
        _REGION_CODE: $(vars.region_code)
        _BASE_URL: $(vars.base_url)
        _COLLECTION: $(vars.collection)
        _CONCURRENCY: $(vars.concurrency)
        _LOCATION: $(vars.location)
        _NUM_SAMPLERS: $(vars.num_samplers)
        _POLL_INTERVAL: $(vars.poll_interval)
        _MODEL: $(vars.model)
        _DEPLOYMENT_NAME: $(vars.deployment_name)
        _MAX_DURATION_SECONDS: $(vars.max_duration_seconds)
        _EVALUATION_MACHINE_TYPE: $(vars.evaluation_machine_type)
        _EVALUATION_MODE: $(vars.evaluation_mode)
        _PROGRAMS_DIR: $(vars.programs_dir)
        _MAX_PROGRAMS_GENERATED: $(vars.max_programs_generated)
        _MAX_DURATION: $(vars.max_duration)
        _IDLE_TIMEOUT: $(vars.idle_timeout)
        _MAX_PROGRAMS_EVALUATED: $(vars.max_programs_evaluated)
        _DELETE_SUCCEEDED_JOBS: $(vars.delete_succeeded_jobs)
        _EVALUATION_PROVISIONING_MODEL: $(vars.evaluation_provisioning_model)
        _USER_EXPERIMENT_NAME: $(vars.user_experiment_name)
        _BOOT_DISK_IMAGE: $(vars.boot_disk_image)
        _CONTROLLER_IMAGE_URI: $(vars.region)-docker.pkg.dev/$(vars.project_id)/$(artifact-repository.artifact_name)/$(vars.user_experiment_name)-controller:latest
        _EVALUATOR_IMAGE_URI: $(vars.region)-docker.pkg.dev/$(vars.project_id)/$(artifact-repository.artifact_name)/$(vars.user_experiment_name)-evaluator:latest
        _ACCELERATOR_COUNT: $(vars.accelerator_count)
        _ACCELERATOR_TYPE: $(vars.accelerator_type)
        _EVALUATOR_SERVICE_ACCOUNT_EMAIL: $(evaluator-sa.service_account_email)
