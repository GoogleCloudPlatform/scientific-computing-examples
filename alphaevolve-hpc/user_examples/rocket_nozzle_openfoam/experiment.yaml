title: "2D Axisymmetric Supersonic Rocket Nozzle OpenFOAM Optimization"
problem_description: |
  Evolve the `design_nozzle(parameters)` generator in Python to synthesize the optimal 6 throat-to-exit Rao/B-spline bell wall contour parameters of a 2D axisymmetric convergent-divergent supersonic rocket nozzle that maximizes the effective sea-level thrust coefficient (`thrust_coefficient`, `C_F = F_thrust / (p_0 * A*)`) when evaluated by an OpenFOAM-14 compressible Navier-Stokes CFD simulation (`shockFluid` Kurganov shock-capturing solver).

  Physics & Operating Conditions (Sea-Level Hot-Gas Rocket Test Stand):
  - Chamber stagnation pressure: `p_0 = 3.0e6` Pa (3.0 MPa / 30 bar).
  - Chamber stagnation temperature: `T_0 = 1200.0` K.
  - Ambient sea-level back-pressure: `p_amb = 101325.0` Pa (1 atm, pressure ratio `p_0 / p_amb = 29.608`).
  - Working gas: Calorically perfect gas (`gamma = 1.4`, `molWeight = 28.96` kg/kmol, `R = 287.10` J/(kg*K)).
  - Geometry & Mesh: Sonic throat radius `r_t = 0.020` m (`D_t = 40` mm), convergent chamber inlet radius `r_in = 0.036` m (`L_conv = 0.035` m), meshed into a 2-block structured 5-degree axisymmetric `wedge` mesh (`1,440` cells) with curved B-spline nozzle walls (`system/blockMeshDict`), validated via `blockMesh` and `checkMesh`, and solved with `foamRun` (`shockFluid`).

  Parameterization & Constraints:
  - `x` must be a 1D NumPy array of shape `(6,)` within `BOUNDS`:
    - `x[0]` (`exit_radius_ratio`, `r_e / r_t` in `[1.40, 3.00]`): Exit-to-throat radius ratio (area expansion ratio `epsilon = (r_e / r_t)^2` in `[1.96, 9.00]`).
    - `x[1]` (`length_ratio`, `L_div / r_t` in `[3.50, 7.50]`): Divergent bell length normalized by throat radius `r_t`.
    - `x[2]` (`theta_n_deg`, `theta_n` in `[12.0, 36.0]` deg): Post-throat circular-arc inflection expansion angle.
    - `x[3]` (`theta_e_deg`, `theta_e` in `[2.0, 18.0]` deg): Nozzle exit lip wall angle.
    - `x[4]` (`throat_rc_ratio`, `R_c,t / r_t` in `[0.35, 1.40]`): Downstream throat circular-arc fillet radius ratio.
    - `x[5]` (`bell_camber`, `c_bell` in `[-0.20, 0.25]`): Quartic bell contour camber modifier on `16 * xi^2 * (1 - xi)^2`.
  - Divergent wall slope `dr/dx` must remain non-negative (`dr/dx >= 0`) and below `46` deg so `blockMesh` and `checkMesh` succeed without internal re-convergence or mesh non-orthogonality failures.
  - Strictly 1 OpenFOAM simulation is executed per candidate program evaluation (`evaluate(parameters)` calls `funct(x, parameters)` once outside the evolve block). Inside `design_nozzle(parameters)`, use compressible gas-dynamics equations (1D isentropic area-Mach and pressure-Mach relations for matched expansion `p_exit = p_amb`, Prandtl-Meyer expansion angle `nu(Ma_e)/2`, Rao optimum thrust bell contour correlations, 2D source-flow divergence factor `(1 + cos(theta))/2`, boundary-layer skin-friction drag integration, or `scipy.optimize` over analytical compressible surrogates) to compute the optimal 6D contour vector `x`.
program_language: "python"
primary_metric: "thrust_coefficient"
initial_score: 1.2195

seed_files:
  - "main.py"

evaluator:
  script: "evaluator.py"
  method: "evaluate"
  postprocess_method: "postprocess"
